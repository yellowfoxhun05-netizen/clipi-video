<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLIPI - Mobil Videómegosztó</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col">

  <!-- FEJLÉC -->
  <header class="sticky top-0 z-50 bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="bg-rose-600 p-2 rounded-xl text-white">
        <i data-lucide="play" class="w-5 h-5 fill-current"></i>
      </div>
      <span class="text-xl font-black text-white tracking-wider">CLIPI</span>
    </div>
    <button onclick="alert('Nyisd meg az alkalmazást az élesítés után!')" class="bg-rose-600 px-4 py-1.5 rounded-full text-xs font-bold text-white shadow">
      Feltöltés
    </button>
  </header>

  <!-- FŐ TARTALOM -->
  <main class="p-4 flex-1 space-y-4">
    <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 text-center">
      <h1 class="text-lg font-bold text-rose-500">Üdvözöl a CLIPI Mobil Felületen!</h1>
      <p class="text-xs text-slate-400 mt-1">Az alkalmazás készen áll az élesítésre.</p>
    </div>

    <!-- DEMÓ VIDEÓ KÁRTYA -->
    <div class="bg-slate-900 rounded-2xl overflow-hidden border border-slate-800 shadow-lg">
      <div class="aspect-video bg-slate-800 relative">
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800&q=80" class="w-full h-full object-cover">
        <div class="absolute inset-0 flex items-center justify-center bg-black/30">
          <div class="bg-rose-600 p-3 rounded-full text-white shadow-lg">
            <i data-lucide="play" class="w-6 h-6 fill-current"></i>
          </div>
        </div>
      </div>
      <div class="p-3 flex gap-3">
        <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150&q=80" class="w-8 h-8 rounded-full border border-slate-700">
        <div>
          <h2 class="font-bold text-sm text-slate-100">Természet és Nyugalom - CLIPI Demo</h2>
          <p class="text-xs text-slate-400 mt-0.5">Nature Explorer • 1.4k megtekintés</p>
        </div>
      </div>
    </div>
  </main>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
